{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">🚨</div>
      <h2>Safety Alert Access</h2>
      <p>Parent & Guardian Dashboard Sign In</p>
    </div>

    <form method="POST" action="{{ url_for('login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="e.g. admin"
          required
          autofocus
          autocomplete="username"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="Enter dashboard password"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
        Sign In to Safety Monitor
      </button>
    </form>

    <div class="login-footer-info">
      <p>Protected gateway for receiving ESP32-CAM alert images and INMP441 audio streams.</p>
    </div>
  </div>
</div>
{% endblock %}
